[workspace]
resolver = "2"
members = [
    "crates/gestalt-kernel",
    "crates/gestalt-runtime",
    "crates/gestalt-std",
    "crates/gestalt-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

[workspace.dependencies]
anyhow = "1.0"
crossterm = "0.28"
ignore = "0.4"
ratatui = "0.29"
regex-lite = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "2.6"
thiserror = "2.0"
tokio = { version = "1.43", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
