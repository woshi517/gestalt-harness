[workspace]
resolver = "2"
members = [
    "crates/gestalt-core",
    "crates/gestalt-cli",
    "crates/gestalt-tui",
    "crates/gestalt-app",
    "crates/gestalt-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/woshi517/gestalt-harness"
authors = ["dansubkh"]

[workspace.lints.rust]
future-incompatible = "warn"
nonstandard-style = "deny"
unsafe-code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Targeted suppressions for common false-positives in this codebase
module-name-repetitions = { level = "allow", priority = 1 }
derive-partial-eq-without-eq = { level = "allow", priority = 1 }
missing-const-for-fn = { level = "allow", priority = 1 }
missing-errors-doc = { level = "allow", priority = 1 }
must-use-candidate = { level = "allow", priority = 1 }
default-constructed-unit-structs = { level = "allow", priority = 1 }
match-same-arms = { level = "allow", priority = 1 }
return-self-not-must-use = { level = "allow", priority = 1 }
struct-excessive-bools = { level = "allow", priority = 1 }
too-many-arguments = { level = "allow", priority = 1 }
too-many-lines = { level = "allow", priority = 1 }
unnecessary-literal-bound = { level = "allow", priority = 1 }
unused-self = { level = "allow", priority = 1 }
ignored-unit-patterns = { level = "allow", priority = 1 }
assigning-clones = { level = "allow", priority = 1 }
manual-let-else = { level = "allow", priority = 1 }
redundant-clone = { level = "allow", priority = 1 }
option-if-let-else = { level = "allow", priority = 1 }
collapsible-if = { level = "allow", priority = 1 }
io-other-error = { level = "allow", priority = 1 }
misnamed-getters = { level = "allow", priority = 1 }
similar-names = { level = "allow", priority = 1 }
bool-to-int-with-if = { level = "allow", priority = 1 }
missing-panics-doc = { level = "allow", priority = 1 }
field-reassign-with-default = { level = "allow", priority = 1 }
unnecessary-map-or = { level = "allow", priority = 1 }
significant-drop-tightening = { level = "allow", priority = 1 }
items-after-statements = { level = "allow", priority = 1 }
uninlined-format-args = { level = "allow", priority = 1 }
redundant-closure-for-method-calls = { level = "allow", priority = 1 }
needless-pass-by-value = { level = "allow", priority = 1 }
redundant-else = { level = "allow", priority = 1 }
unnecessary-debug-formatting = { level = "allow", priority = 1 }
expect-fun-call = { level = "allow", priority = 1 }
collapsible-match = { level = "allow", priority = 1 }
default-trait-access = { level = "allow", priority = 1 }
useless-vec = { level = "allow", priority = 1 }
unused-async = { level = "allow", priority = 1 }

[workspace.dependencies]
# === Core shared deps ===
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time", "signal", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
thiserror = "2"
futures = "0.3"
async-trait = "0.1"
tokio-util = "0.7"

# === Provider / HTTP ===
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio-stream = "0.1"
eventsource-stream = "0.2"

# === CLI ===
clap = { version = "4", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# === Context ===
tiktoken-rs = "0.6"
pulldown-cmark = "0.12"
sha2 = "0.10"
serde_yaml = "0.9"

# === Trace ===
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# === Policy ===
glob = "0.3"
url = "2"

# === Tools ===
encoding_rs = "0.8"
libc = "0.2"
similar = { version = "2", features = ["text", "inline"] }

# === Optional / feature-gated ===
ratatui = { version = "0.29" }
crossterm = { version = "0.28" }

[profile.release]
strip = true
lto = true
codegen-units = 1
