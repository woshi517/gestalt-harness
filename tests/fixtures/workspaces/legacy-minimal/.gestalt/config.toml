[defaults]
provider = "anthropic"
model = "claude-sonnet-4-6"
mode = "confirm"
max_turns = 50

[tools]
bash_timeout_secs = 60
max_output_tokens = 4000
sandbox_type = "none"

[context]
max_context_window = 120000
reserved_output_tokens = 8000

[observe]
run_log_dir = ".gestalt/runs"
log_format = "jsonl"
