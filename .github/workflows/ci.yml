name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check & Harden (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check runtime feature matrix
        run: |
          cargo check -p gestalt-runtime --no-default-features --locked
          for feature in providers tools mcp skills verify trace; do
            cargo check -p gestalt-runtime --no-default-features --features "$feature" --locked
          done
          cargo check -p gestalt-runtime --all-features --locked

      - name: Build workspace
        run: cargo build --workspace

      - name: Build minimal CLI
        run: cargo check -p gestalt-cli --no-default-features --locked

      - name: Test minimal CLI feature errors
        run: cargo test -p gestalt-cli --no-default-features --locked

      - name: Test trace-disabled checkpoint rendering
        run: cargo test -p gestalt-runtime --no-default-features --test context_management_tests trace_disabled_compaction --locked

      - name: Build standalone TUI
        run: cargo check -p gestalt-tui

      - name: Test workspace
        run: cargo test --workspace --all-features --locked

      - name: Verify dependency boundaries and budgets
        run: bash scripts/check-deps.sh

      - name: Verify install smoke
        run: bash scripts/install-smoke.sh

      - name: Verify release binary size
        run: bash scripts/check-binary-size.sh
