[package]
name = "gestalt-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
gestalt-core = { path = "../gestalt-core" }
tokio = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true, optional = true }
url = { workspace = true }
reqwest = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
eventsource-stream = { workspace = true, optional = true }
encoding_rs = { workspace = true, optional = true }
glob = { workspace = true }
similar = { workspace = true, optional = true }
tracing = { workspace = true }
pulldown-cmark = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
libc = { workspace = true }
tokio-util = { workspace = true }
walkdir = { version = "2", optional = true }
regex = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["providers", "tools", "trace"]
providers = ["dep:eventsource-stream", "dep:reqwest", "dep:tokio-stream", "toml-config"]
tools = ["dep:encoding_rs", "dep:regex", "dep:reqwest", "dep:similar", "dep:walkdir", "toml-config"]
mcp = ["toml-config"]
skills = ["dep:serde_yaml", "toml-config"]
verify = ["tools", "dep:pulldown-cmark"]
trace = ["toml-config"]
toml-config = ["dep:toml"]

[[bin]]
name = "mock_mcp_server"
path = "src/bin/mock_mcp_server.rs"
required-features = ["mcp"]
