[package]
name = "gestalt-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Local-first AI agent harness for safe, inspectable single-agent work."
readme = "../../README.md"

[lib]
name = "gestalt_cli"
path = "src/lib.rs"

[[bin]]
name = "gestalt"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
gestalt-core = { path = "../gestalt-core" }
gestalt-app = { path = "../gestalt-app", default-features = false }
gestalt-runtime = { path = "../gestalt-runtime", default-features = false }
clap = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rpassword = "7"

[features]
default = ["mcp", "skills", "verify"]
mcp = ["gestalt-app/mcp", "gestalt-runtime/mcp"]
skills = ["gestalt-app/skills", "gestalt-runtime/skills"]
verify = ["gestalt-app/verify", "gestalt-runtime/verify"]
otel = ["gestalt-app/otel", "gestalt-runtime/otel"]

[dev-dependencies]
uuid = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
insta = { version = "1", features = ["filters"] }
