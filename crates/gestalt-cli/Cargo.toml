[package]
name = "gestalt-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Local-first AI agent harness for safe, inspectable single-agent work."
readme = "../../README.md"

[lib]
name = "gestalt_cli"
path = "src/lib.rs"

[[bin]]
name = "gestalt"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
gestalt-core = { path = "../gestalt-core" }
gestalt-app = { path = "../gestalt-app" }
gestalt-models = { path = "../gestalt-models" }
gestalt-tools = { path = "../gestalt-tools" }
gestalt-policy = { path = "../gestalt-policy" }
gestalt-trace = { path = "../gestalt-trace" }
gestalt-verify = { path = "../gestalt-verify" }
gestalt-runtime = { path = "../gestalt-runtime" }
clap = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

[features]
default = []
tui = ["dep:ratatui", "dep:crossterm"]
otel = ["gestalt-trace/otel"]

[dependencies.ratatui]
workspace = true
optional = true

[dependencies.crossterm]
workspace = true
optional = true

[dev-dependencies]
uuid = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
insta = { version = "1", features = ["filters"] }

